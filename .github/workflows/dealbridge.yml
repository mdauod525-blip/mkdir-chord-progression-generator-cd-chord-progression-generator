name: DealBridge AI — test & build

on:
  push:
    paths: ['dealbridge/**', '.github/workflows/dealbridge*.yml']
  pull_request:
    paths: ['dealbridge/**', '.github/workflows/dealbridge*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: dealbridge, POSTGRES_PASSWORD: dealbridge, POSTGRES_DB: dealbridge_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealbridge" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: dealbridge/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: dealbridge/backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL + PostGIS)
        run: python -m pytest -q
        env: { DEALBRIDGE_DATABASE_URL: 'postgresql+psycopg://dealbridge:dealbridge@localhost:5432/dealbridge_test' }
      - name: Migrations apply and match the models
        run: |
          PGPASSWORD=dealbridge psql -h localhost -U dealbridge -d dealbridge_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head && alembic check
        env: { DEALBRIDGE_DATABASE_URL: 'postgresql+psycopg://dealbridge:dealbridge@localhost:5432/dealbridge_test' }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dealbridge/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dealbridge/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
